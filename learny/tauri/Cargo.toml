[package]
name = "learny" # TODO: Need to rename to propper name for this crate, learny is the app name not the tauri layer
version = "0.1.0"
description = "backend of the app"
authors = ["pascalino"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "learny_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                  = { version = "^2.0.0", features = ["protocol-asset"] }
serde                  = { version = "1", features = ["derive"] }
application            = { path = "../application" }
adapter_sqlite         = { path = "../adapters/sqlite" }
ports                  = { path = "../ports" }
domain_flashcard       = { path = "../domain/flashcard" }
domain_tagging         = { path = "../domain/tagging" }
tauri-plugin-fs-adapter = { path = "../adapters/fs_adapter" }
mime_guess             = "2.0"
urlencoding            = "2.1"
tauri-plugin-dialog    = "^2.0.0"
futures                = "*"
syntect               = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
pulldown-cmark        = "0.13.1"

# Tauri only turns on wry's `fullscreen` (WKWebView `fullScreenEnabled`) via
# `macos-private-api`; without it <video> has no fullscreen button on macOS.
# Depending on wry directly unifies the feature into Tauri's copy.
[target.'cfg(target_os = "macos")'.dependencies]
wry                    = { version = "0.54", default-features = false, features = ["fullscreen"] }
