[package]
name = "learny-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "learny-web"
path = "src/main.rs"

[dependencies]
# Web framework
axum          = { version = "0.7", features = ["multipart"] }
tokio         = { version = "1",   features = ["full"] }
tower-http    = { version = "0.5", features = ["fs", "cors"] }

# Auth
axum-login     = "0.16"
tower-sessions = "0.13"
argon2         = "0.5"
async-trait    = "0.1"
thiserror      = "2"

# Serialisation
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

# Domain / application
application      = { path = "../application" }
adapter_sqlite   = { path = "../adapters/sqlite" }
domain_flashcard = { path = "../domain/flashcard" }
domain_auth      = { path = "../domain/auth" }
ports            = { path = "../ports" }

# File handling
uuid       = { version = "1", features = ["v4"] }
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }
dirs       = "5"
image      = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
