[package]
name = "application"
version = "0.1.0"
edition = "2021"

[dependencies]
ports            = { path = "../ports" }
domain_flashcard = { path = "../domain/flashcard" }
domain_tagging   = { path = "../domain/tagging" }
domain_analytics = { path = "../domain/analytics" }
chrono           = "0.4"
rand             = "0.8"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
uuid             = { version = "1.19.0", features = ["v4"] }
zip              = "7.0.0"

[dev-dependencies]
adapter_sqlite   = { path = "../adapters/sqlite" }
rusqlite         = { version = "0.37.0", features = ["bundled", "functions"] }
