[package]
name = "tauri-plugin-fs-adapter"
version = "0.1.0"
authors = [ "You" ]
description = ""
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-fs-adapter"

[dependencies]
tauri = { version = "2.9.2" }
serde = "1.0"
thiserror = "2"
serde_json = "1"
tauri-plugin-dialog = "^2.0.0"
oneshot = "0.1"
futures = "*"
uuid = { version ="1.19.0" , features = ["v4"] }
image = { version = "0.25", features = ["jpeg", "png", "webp"] }

[target."cfg(target_os = \"macos\")".dependencies]
libc = "0.2"

[build-dependencies]
tauri-plugin = { version = "2.5.1", features = ["build"] }
