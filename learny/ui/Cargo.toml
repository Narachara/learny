[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[features]
default  = ["tauri"]        # Tauri desktop — no extra flags needed
tauri    = []               # Tauri invoke bridge
server   = ["gloo-net"]     # HTTP fetch bridge — build with: --no-default-features --features server

[dependencies]
dioxus            = { version = "0.7.9", features = ["web", "router"] }
dioxus-logger     = "0.6"
wasm-bindgen      = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers       = { version = "0.3", features = ["futures"] }
web-sys           = { version = "0.3", features = ["Blob", "BlobPropertyBag", "HtmlAnchorElement", "Url", "Window", "Navigator", "Clipboard", "Document", "Element", "EventTarget", "KeyboardEvent", "DomRect"] }
js-sys            = "0.3"
serde             = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json        = "1"
domain_flashcard  = { path = "../domain/flashcard" }
domain_tagging    = { path = "../domain/tagging" }
chrono            = "0.4.42"
urlencoding       = "2"
pulldown-cmark    = "0.13.1"

# web feature only — HTTP client for the fetch bridge
gloo-net          = { version = "0.6", features = ["http"], optional = true }
